<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastery Test: Modals & Media (50 Questions) - Ms Ngoc Hai FTU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-bg-1: #8854C0;
            --primary-bg-2: #FDCB6E;
            --primary-bg-3: #00C9A7;
            --primary-bg-4: #FF7675;
            --correct-color: #00D26A;
            --correct-shadow: #00A352;
            --wrong-color: #FF4757;
            --wrong-shadow: #D63031;
            --selected-color: #6C5CE7;
            --selected-shadow: #4834D4;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #2D3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF7675, #6C5CE7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
            padding: 20px 10px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SVG Pattern Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><text x="15" y="35" font-size="22" opacity="0.3">⭐</text><text x="75" y="25" font-size="24" opacity="0.3">🌸</text><text x="95" y="85" font-size="20" opacity="0.3">🍓</text><text x="25" y="95" font-size="24" opacity="0.3">🐱</text><text x="60" y="60" font-size="22" opacity="0.3">☁️</text></svg>');
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 840px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            border: 3px solid #FFF;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #6C5CE7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .teacher-tag {
            font-size: 0.8rem;
            font-weight: 800;
            color: #D63031;
            background: #FFEAA7;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            border: 2px solid #FDCB6E;
            margin-top: 3px;
        }

        .level-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .level-btn {
            background: #FFF;
            border: 3px solid #CBD5E1;
            border-bottom: 5px solid #94A3B8;
            border-radius: 16px;
            padding: 8px 16px;
            font-size: 0.92rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
        }

        .level-btn.active {
            background: #6C5CE7;
            border-color: #6C5CE7;
            border-bottom-color: #4834D4;
            color: #FFF;
            transform: translateY(-2px);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFF;
            padding: 10px 18px;
            border-radius: 16px;
            box-shadow: 0 5px 0px #DFE6E9;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .progress-container {
            flex-grow: 1;
            margin: 0 15px;
            background: #DFE6E9;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00C9A7, #00D26A);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .filter-bar {
            display: none;
            gap: 10px;
            justify-content: center;
        }

        .filter-bar.active {
            display: flex;
        }

        .filter-btn {
            background: #FFF;
            border: 3px solid #CBD5E1;
            border-bottom: 5px solid #94A3B8;
            border-radius: 14px;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn.active {
            background: #6C5CE7;
            border-color: #6C5CE7;
            border-bottom-color: #4834D4;
            color: #FFF;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #FFF;
            transition: transform 0.2s, opacity 0.3s;
        }

        .question-card.hidden {
            display: none;
        }

        .card-header-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .question-number {
            font-size: 0.9rem;
            font-weight: 800;
            color: #0984E3;
            background: #E1F5FE;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .level-indicator {
            font-size: 0.8rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .level-easy { background: #E8F5E9; color: #2E7D32; }
        .level-medium { background: #FFF3E0; color: #E65100; }
        .level-hard { background: #F3E5F5; color: #7B1FA2; }

        .status-badge {
            display: none;
            font-size: 0.82rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .status-badge.correct {
            display: inline-block;
            background: #D1FAE5;
            color: #059669;
        }

        .status-badge.wrong {
            display: inline-block;
            background: #FEE2E2;
            color: #DC2626;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2D3436;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* Gap Fill Specific Style */
        .gap-slot {
            display: inline-block;
            background: #E0E7FF;
            color: #3730A3;
            border: 2px dashed #6366F1;
            padding: 2px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            margin: 0 4px;
            transition: all 0.2s;
        }
        .gap-slot:hover {
            background: #C7D2FE;
        }
        .gap-slot.filled {
            background: #EEF2FF;
            border-style: solid;
        }

        /* Options Grid for Multiple Choice */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-bottom: 6px solid #CBD5E1;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: 800;
            color: #475569;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            outline: none;
        }

        .option-btn:hover:not(.locked) {
            transform: translateY(-2px);
            border-color: #A7F3D0;
            background: #F0FDF4;
        }

        .option-btn:active:not(.locked) {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }

        .option-prefix {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #F1F5F9;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .option-btn.selected {
            background-color: var(--selected-color) !important;
            border-color: var(--selected-color) !important;
            border-bottom-color: var(--selected-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.selected .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
            border-bottom-color: var(--correct-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.correct .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            border-color: var(--wrong-color) !important;
            border-bottom-color: var(--wrong-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.wrong .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .explanation-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #F0FDF4;
            border: 2px dashed #00C9A7;
            border-radius: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-size: 1rem;
            font-weight: 900;
            color: #059669;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            border-bottom: 2px solid #A7F3D0;
            padding-bottom: 4px;
        }

        .exp-section {
            margin-bottom: 6px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .exp-section strong {
            color: #065F46;
        }

        .exp-options-list {
            list-style: none;
            margin: 4px 0;
            padding-left: 6px;
        }

        .exp-options-list li {
            margin-bottom: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn-container {
            text-align: center;
            margin: 10px 0 30px;
        }

        .submit-btn {
            background: linear-gradient(180deg, #FF7675 0%, #D63031 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 14px 34px;
            border: none;
            border-radius: 22px;
            box-shadow: 0 7px 0 #B22222, 0 10px 18px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 0 #B22222, 0 12px 22px rgba(0,0,0,0.25);
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #B22222, 0 5px 8px rgba(0,0,0,0.2);
        }

        /* Gap Fill Selection Modal Popup */
        .gap-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1100;
            padding: 20px;
        }
        .gap-modal-overlay.active {
            display: flex;
        }
        .gap-modal-card {
            background: #FFF;
            border-radius: 20px;
            padding: 20px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            border: 5px solid #6C5CE7;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .gap-modal-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: #6C5CE7;
            margin-bottom: 12px;
        }
        .gap-options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .gap-option-item {
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            border-radius: 12px;
            padding: 10px;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
            transition: all 0.1s;
        }
        .gap-option-item:hover {
            background: #6C5CE7;
            color: #FFF;
            border-color: #6C5CE7;
        }

        /* Score Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-card {
            background: #FFF;
            border-radius: 26px;
            padding: 28px 18px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 6px solid #FDCB6E;
        }

        .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 6px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #6C5CE7;
            margin-bottom: 6px;
        }

        .score-display {
            font-size: 2.6rem;
            font-weight: 900;
            color: #00C9A7;
            margin: 8px 0;
        }

        .feedback-text {
            font-size: 1rem;
            font-weight: 700;
            color: #2D3436;
            margin-bottom: 18px;
            line-height: 1.45;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        .btn-view-all {
            background: #00C9A7;
            color: #FFF;
            box-shadow: 0 4px 0 #00A352;
        }

        .btn-view-wrong {
            background: #FF7675;
            color: #FFF;
            box-shadow: 0 4px 0 #D63031;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Modals & Media Mastery Test (50 Questions)</h1>
            <div class="teacher-tag">Giáo viên tạo: Ms Ngoc Hai FTU</div>
        </header>

        <div class="level-nav">
            <button class="level-btn active" onclick="switchLevelFilter('all')">Tất cả (50 câu)</button>

    <!-- Gap Fill Selection Popup Modal -->
    <div class="gap-modal-overlay" id="gapModal">
        <div class="gap-modal-card">

    <!-- Score Modal Popup -->
    <div class="modal-overlay" id="scoreModal">

            <div class="modal-icon" id="modalIcon">🏆</div>

            <div class="modal-actions">
                <button class="modal-btn btn-view-wrong" onclick="reviewWrongAnswers()">🔍 Xem các câu làm sai</button>
                <button class="modal-btn btn-view-all" onclick="reviewAllAnswers()">📖 Xem toàn bộ bài giải</button>
            </div>
        </div>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (type === 'correct') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(250, now + 0.12);
                    osc.frequency.setValueAtTime(200, now + 0.24);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.log("Audio API not supported");
            }
        }

        const rawQuestionsData = [
            // ==================== BÀI 1: CƠ BẢN (20 CÂU: 10 MCQ + 10 GAP FILL) ====================
            {
                type: "mcq",
                level: "easy",
                levelLabel: "Bài 1: Cơ bản",
                q: "You ______ really speak seven languages fluently, can you?",
                options: ["can't", "mustn't", "shouldn't", "needn't"],
                answer: "can't",
                exp: {
                    translations: [
                        "A. can't: không thể",
                        "B. mustn't: không được phép",
                        "C. shouldn't: không nên",
                        "D. needn't: không cần thiết"
                    ],
                    sentenceTrans: "Bạn không thực sự nói lưu loát bảy thứ tiếng phải không?",
                    whyCorrect: "Chọn A ('can't') vì đây là cấu trúc diễn tả khả năng thực tế hiện tại (real current ability)[cite: 35].",
                    whyWrong: "B, C, D sai về ngữ nghĩa và không phù hợp với chức năng hỏi về khả năng."
                }
            },
            {
                type: "mcq",
                level: "easy",
                levelLabel: "Bài 1: Cơ bản",
                q: "There's no way you ______ read when you were two years old!",
                options: ["could", "can", "must", "will"],
                answer: "could",
                exp: {
                    translations: [
                        "A. could: có thể (quá khứ)",
                        "B. can: có thể (hiện tại)",
                        "C. must: phải",
                        "D. will: sẽ"
                    ],
                    sentenceTrans: "Không đời nào bạn có thể đọc sách khi mới hai tuổi được!",
                    whyCorrect: "Chọn A ('could') vì đây là câu nói về khả năng trong quá khứ (past ability)[cite: 35].",
                    whyWrong: "B, C, D không dùng cho mốc thời gian quá khứ 'when you were two'."
                }
            },
            {
                type: "mcq",
                level: "easy",
                levelLabel: "Bài 1: Cơ bản",
                q: "______ I finish watching this TV program before I go to bed?",
                options: ["Can", "Must", "Should", "Will"],
                answer: "Can",
                exp: {
                    translations: [
                        "A. Can: có thể (xin phép)",
                        "B. Must: phải",
                        "C. Should: nên",
                        "D. Will: sẽ"
                    ],
                    sentenceTrans: "Con có thể xem nốt chương trình này trước khi đi ngủ không?",
                    whyCorrect: "Chọn A ('Can') vì dùng để hỏi xin phép (asking for permission) trong văn cảnh thân mật[cite: 35].",
                    whyWrong: "B, C, D không dùng để xin phép trực tiếp thông thường."
                }
            },
            {
                type: "mcq",
                level: "easy",
                levelLabel: "Bài 1: Cơ bản",
                q: "You ______ try to get that poem published in a literary magazine.",
                options: ["should", "mustn't", "might", "can't"],
                answer: "should",
                exp: {
                    translations: [
                        "A. should: nên",

                    whyCorrect: "Chọn A vì 'gainsay' có nghĩa là bác bỏ hay cãi lại quy định chính thức.",

            {

                answer: "unsaid",
                exp: {
                    translations: [
                        "A. unsaid (adj trong 'leave sth unsaid'): không nói ra, giữ kín",
                        "B. gainsay (v): bác bỏ",

                    ],
                    sentenceTrans: "Hãy nhìn vào tin nhắn điện thoại hiển thị ở trên. Sarah hối hận vì nhiều lời nói cay đắng tốt nhất nên được giữ kín không thốt ra trong cuộc tranh cãi gay gắt của họ.",
                    whyCorrect: "Chọn A vì cấu trúc cố định 'leave sth unsaid' nghĩa là chọn cách im lặng không nói ra lời cay đắng.",
                    whyWrong: "B, C, D sai từ loại và không thuộc cấu trúc cố định này."

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let userAnswers = {};
        let shuffledQuestions = [];
        let isSubmitted = false;
        let currentLevelFilter = 'all';
        let activeGapCardIndex = null;

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            userAnswers = {};
            isSubmitted = false;

            const shuffledRaw = shuffleArray(rawQuestionsData);

            shuffledQuestions = shuffledRaw.map((item, index) => {
                let shuffledOpts = [];
                if (item.type === 'mcq') {
                    shuffledOpts = shuffleArray(item.options);
                } else {
                    shuffledOpts = shuffleArray(item.options);
                }
                return {
                    ...item,
                    displayIndex: index + 1,
                    shuffledOpts: shuffledOpts
                };
            });

            shuffledQuestions.forEach((qData, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${qIndex}`;
                card.dataset.level = qData.level;

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header-badge';

                const badgeGroup = document.createElement('div');
                badgeGroup.className = 'badge-group';

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Câu ${qIndex + 1} / ${shuffledQuestions.length}`;

                const levelTag = document.createElement('div');
                levelTag.className = `level-indicator level-${qData.level}`;
                levelTag.innerText = qData.levelLabel;

                badgeGroup.appendChild(qNum);
                badgeGroup.appendChild(levelTag);

                const statusBadge = document.createElement('div');
                statusBadge.className = 'status-badge';
                statusBadge.id = `badge-${qIndex}`;

                cardHeader.appendChild(badgeGroup);
                cardHeader.appendChild(statusBadge);

                let formattedQText = qData.q;
                if (qData.type === 'gap') {
                    formattedQText = formattedQText.replace('[GAP]', `<span class="gap-slot" id="gap-slot-${qIndex}" onclick="openGapModal(${qIndex})">[ Chọn từ ]</span>`);
                }

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = formattedQText;

                card.appendChild(cardHeader);
                card.appendChild(qText);

                if (qData.type === 'mcq') {
                    const optsGrid = document.createElement('div');
                    optsGrid.className = 'options-grid';
                    const prefixes = ['A', 'B', 'C', 'D'];

                    qData.shuffledOpts.forEach((opt, optIdx) => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.id = `opt-${qIndex}-${optIdx}`;
                        btn.onclick = () => handleSelectMCQ(qIndex, opt, btn);

                        const prefix = document.createElement('span');
                        prefix.className = 'option-prefix';
                        prefix.innerText = prefixes[optIdx];

                        const textSpan = document.createElement('span');
                        textSpan.innerHTML = opt;

                        btn.appendChild(prefix);
                        btn.appendChild(textSpan);
                        optsGrid.appendChild(btn);
                    });
                    card.appendChild(optsGrid);
                }

                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `explanation-${qIndex}`;

                expBox.innerHTML = `
                    <div class="explanation-title">
                        💡 PHẦN GIẢI THÍCH CHI TIẾT (Ms Ngoc Hai FTU)
                    </div>
                    <div class="exp-section">
                        <strong>1. Phân tích từ vựng/ngữ pháp 4 đáp án:</strong>
                        <ul class="exp-options-list">
                            ${qData.exp.translations.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="exp-section">
                        <strong>2. Dịch nghĩa toàn câu:</strong><br>
                        <em>"${qData.exp.sentenceTrans}"</em>
                    </div>
                    <div class="exp-section">
                        <strong>3. Tại sao chọn đáp án đúng?</strong><br>
                        ${qData.exp.whyCorrect}
                    </div>
                    <div class="exp-section">
                        <strong>4. Tại sao các đáp án còn lại chưa đúng?</strong><br>
                        ${qData.exp.whyWrong}
                    </div>
                `;

                card.appendChild(expBox);
                container.appendChild(card);
            });

            updateProgress();
            updateTotalVisibleCount();
        }

        function handleSelectMCQ(qIndex, selectedOpt, btn) {
            if (isSubmitted) return;

            const card = document.getElementById(`question-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');

            buttons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            userAnswers[qIndex] = selectedOpt;
            updateProgress();
        }

        function openGapModal(qIndex) {
            if (isSubmitted) return;
            activeGapCardIndex = qIndex;
            const qData = shuffledQuestions[qIndex];
            const listEl = document.getElementById('gapOptionsList');
            listEl.innerHTML = '';

            qData.shuffledOpts.forEach(opt => {
                const item = document.createElement('div');
                item.className = 'gap-option-item';
                item.innerText = opt;
                item.onclick = () => selectGapOption(opt);
                listEl.appendChild(item);
            });

            document.getElementById('gapModal').classList.add('active');
        }

        function selectGapOption(opt) {
            if (activeGapCardIndex === null) return;
            const qIndex = activeGapCardIndex;
            userAnswers[qIndex] = opt;

            const slot = document.getElementById(`gap-slot-${qIndex}`);
            slot.innerText = opt;
            slot.classList.add('filled');

            document.getElementById('gapModal').classList.remove('active');
            activeGapCardIndex = null;
            updateProgress();
        }

        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = shuffledQuestions.length;
            const pct = (answeredCount / total) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;
            document.getElementById('progressText').innerText = `${answeredCount}/${total}`;
        }

        function updateTotalVisibleCount() {
            const cards = document.querySelectorAll('.question-card:not(.hidden)');
            document.getElementById('totalVisibleCount').innerText = cards.length;
        }

        function switchLevelFilter(level) {
            currentLevelFilter = level;
            const buttons = document.querySelectorAll('.level-nav .level-btn');
            buttons.forEach(b => b.classList.remove('active'));

            event.target.classList.add('active');

            const cards = document.querySelectorAll('.question-card');
            cards.forEach(card => {
                if (level === 'all' || card.dataset.level === level) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });

            updateTotalVisibleCount();
        }

        document.getElementById('submitBtn').addEventListener('click', () => {
            const total = shuffledQuestions.length;
            const answeredCount = Object.keys(userAnswers).length;

            if (answeredCount < total) {
                const confirmSubmit = confirm(`Em mới hoàn thành ${answeredCount}/${total} câu hỏi. Em có chắc chắn muốn nộp bài ngay để chấm điểm không?`);
                if (!confirmSubmit) return;
            }

            isSubmitted = true;
            let score = 0;
            let wrongCount = 0;

            shuffledQuestions.forEach((qData, qIndex) => {
                const card = document.getElementById(`question-${qIndex}`);
                const expBox = document.getElementById(`explanation-${qIndex}`);
                const badge = document.getElementById(`badge-${qIndex}`);
                const userChoice = userAnswers[qIndex];
                const isCorrect = (userChoice === qData.answer);

                if (qData.type === 'mcq') {
                    const buttons = card.querySelectorAll('.option-btn');
                    buttons.forEach(b => {
                        b.classList.add('locked');
                        b.style.cursor = 'default';
                    });
                    buttons.forEach(b => {
                        b.classList.remove('selected');
                        const textSpan = b.querySelector('span:last-child');
                        if (textSpan.innerHTML.trim() === qData.answer || textSpan.innerText.trim() === qData.answer) {
                            b.classList.add('correct');
                        } else if ((textSpan.innerHTML.trim() === userChoice || textSpan.innerText.trim() === userChoice) && !isCorrect) {
                            b.classList.add('wrong');
                        }
                    });
                } else {
                    const slot = document.getElementById(`gap-slot-${qIndex}`);
                    if (isCorrect) {
                        slot.style.background = '#00D26A';
                        slot.style.color = '#FFF';
                        slot.style.borderColor = '#00A352';
                    } else {
                        slot.style.background = '#FF4757';
                        slot.style.color = '#FFF';
                        slot.style.borderColor = '#D63031';
                        slot.innerHTML = `${userChoice || 'Chưa chọn'} (Đúng: ${qData.answer})`;
                    }
                }

                if (isCorrect) {
                    score++;
                    badge.className = 'status-badge correct';
                    badge.innerText = '✓ ĐÚNG';
                    card.dataset.result = 'correct';
                } else {
                    wrongCount++;
                    badge.className = 'status-badge wrong';
                    badge.innerText = '✗ SAI';
                    card.dataset.result = 'wrong';
                }

                expBox.classList.add('active');
            });

            if (score >= total * 0.7) {
                playSound('correct');
                confetti({ particleCount: 150, spread: 85, origin: { y: 0.6 } });
            } else {
                playSound('wrong');
            }

            document.getElementById('wrongCount').innerText = wrongCount;
            document.getElementById('filterBar').classList.add('active');
            document.getElementById('statsLabel').innerText = '🎯 Kết quả kiểm tra';
            document.getElementById('submitContainer').style.display = 'none';

            document.getElementById('scoreDisplay').innerText = `${score}/${total}`;
            let feedback = "";
            let icon = "🏆";
            if (score === total) {
                feedback = "XUẤT SẮC TUYỆT ĐỐI! Em là bậc thầy làm chủ cả 50 câu Modals & Media! 👑✨";
                icon = "🌟";
            } else if (score >= total * 0.8) {
                feedback = "RẤT TUYỆT VỜI! Kiến thức ngữ pháp và từ vựng của em cực kỳ vững chắc! 🎉";
                icon = "🔥";
            } else if (score >= total * 0.5) {
                feedback = "KHÁ TỐT! Em đã nỗ lực hoàn thành bài test lớn. Hãy bấm xem lại các câu sai để rút kinh nghiệm nhé! 💪";
                icon = "👏";
            } else {
                feedback = "CỐ GẮNG THÊM NHÉ! Hãy đọc kĩ từng phần phân tích chi tiết của Ms Ngoc Hai FTU bên dưới để củng cố lại bài học nào! 📚";
                icon = "🌱";
            }

            document.getElementById('feedbackText').innerText = feedback;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('scoreModal').classList.add('active');
        });

        function reviewWrongAnswers() {
            document.getElementById('scoreModal').classList.remove('active');
            filterQuestionsResult('wrong');
        }

        function reviewAllAnswers() {
            document.getElementById('scoreModal').classList.remove('active');
            filterQuestionsResult('all');
        }

        function filterQuestionsResult(type) {
            const cards = document.querySelectorAll('.question-card');
            const btnAll = document.getElementById('btnFilterAll');
            const btnWrong = document.getElementById('btnFilterWrong');

            if (type === 'wrong') {
                btnWrong.classList.add('active');
                btnAll.classList.remove('active');
                cards.forEach(c => {
                    const matchLevel = (currentLevelFilter === 'all' || c.dataset.level === currentLevelFilter);
                    if (c.dataset.result === 'wrong' && matchLevel) {
                        c.classList.remove('hidden');
                    } else {
                        c.classList.add('hidden');
                    }
                });
            } else {
                btnAll.classList.add('active');
                btnWrong.classList.remove('active');
                cards.forEach(c => {
                    const matchLevel = (currentLevelFilter === 'all' || c.dataset.level === currentLevelFilter);
                    if (matchLevel) {
                        c.classList.remove('hidden');
                    } else {
                        c.classList.add('hidden');
                    }
                });
            }
            updateTotalVisibleCount();
        }

        window.onload = () => {
            renderQuiz();
        };
    </script>
